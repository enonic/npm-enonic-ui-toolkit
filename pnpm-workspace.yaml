packages:
  - 'packages/*'

# One version of the toolchain for every package, bumped by hand. Dependabot does read
# `catalog:` specifiers (GA 2025-02-04), but dependabot-core#12244 is still open: a catalog
# bump rewrites the lockfile `specifier` to a concrete version, which then fails
# `pnpm install --frozen-lockfile`. Package dependencies stay in each package.json because
# a single toolchain version across five manifests is worth centralising and their deps are not.
catalog:
  # Types for the Node the toolchain runs on (.nvmrc). The published packages are browser
  # code with a lower engines floor; `scripts/assert-externals.mjs` keeps `node:*` out of them.
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  preact: ^10.29.8
  publint: ^0.3.24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  vitest: 4.1.10

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

# `vite` is an alias onto vite-plus-core: it satisfies vitest's peer at runtime but not by
# version. react/react-dom are aliased to preact/compat, so the real packages never install.
peerDependencyRules:
  allowAny:
    - vite
    - react
    - react-dom
  allowedVersions:
    vite: '*'

# A peer conflict is an install error, not a warning; the rules above are the exceptions.
strictPeerDependencies: true

savePrefix: '~'
auditLevel: moderate

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@enonic/*'
